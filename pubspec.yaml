name: halo_app
description: Halo CMS Android Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dio: ^5.3.2
  flutter_html: ^3.0.0-beta.2
  cached_network_image: ^3.3.0
  pull_to_refresh: ^2.0.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
